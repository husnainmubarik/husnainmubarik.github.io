<!-- Dark mode toggle button and script -->
<style>
/* Remove blank space when no page title */
.page__title {
  display: none;
}

.page__content > h2:first-child {
  margin-top: 0;
}

.page__inner-wrap > header {
  margin-bottom: 0;
}

.theme-toggle {
  position: fixed;
  top: 70px;
  right: 20px;
  z-index: 9999;
  background: #333;
  color: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-toggle:hover {
  background: #555;
  transform: scale(1.1);
}

@media (max-width: 768px) {
  .theme-toggle {
    top: 60px;
    right: 10px;
    width: 35px;
    height: 35px;
    font-size: 18px;
  }
}

body.dark-mode {
  background-color: #1a1a1a;
  color: #e0e0e0;
}

body.dark-mode .page {
  background-color: #1a1a1a;
}

body.dark-mode .masthead {
  background-color: #2a2a2a !important;
  border-bottom-color: #444 !important;
}

body.dark-mode .masthead__inner-wrap {
  background-color: #2a2a2a !important;
}

body.dark-mode .site-title,
body.dark-mode .site-title:visited {
  color: #6ea8fe !important;
}

body.dark-mode .greedy-nav {
  background-color: #2a2a2a !important;
}

body.dark-mode .greedy-nav a {
  color: #9ec5fe !important;
}

body.dark-mode .greedy-nav a:hover {
  color: #6ea8fe !important;
}

body.dark-mode .greedy-nav .visible-links a:before {
  background: #6ea8fe !important;
}

body.dark-mode .masthead__menu-item {
  color: #9ec5fe !important;
}

body.dark-mode .sidebar {
  background-color: #1a1a1a !important;
}

body.dark-mode .author__avatar img {
  border-color: #444;
}

body.dark-mode .author__content,
body.dark-mode .author__urls-wrapper {
  color: #e0e0e0;
}

body.dark-mode .author__name {
  color: #ffffff !important;
}

body.dark-mode .author__bio {
  color: #cccccc !important;
}

body.dark-mode .author__urls.social-icons a {
  color: #6ea8fe;
}

body.dark-mode .author__urls.social-icons i {
  color: #6ea8fe;
}

body.dark-mode .author__urls.social-icons a:hover {
  color: #9ec5fe;
}

body.dark-mode .author__urls.social-icons svg {
  fill: #6ea8fe;
}

body.dark-mode .page__content h1,
body.dark-mode .page__content h2,
body.dark-mode .page__content h3,
body.dark-mode .page__content h4 {
  color: #e0e0e0;
}

body.dark-mode a {
  color: #6ea8fe;
}

body.dark-mode a:hover {
  color: #9ec5fe;
}

body.dark-mode .news-box {
  background-color: #2a2a2a;
  border-color: #444;
}

body.dark-mode .page__footer {
  background-color: #2a2a2a;
  border-top-color: #444;
}

body.dark-mode code {
  background-color: #2a2a2a;
  color: #e0e0e0;
}

/* Light mode - darken sidebar text */
.author__name {
  color: #000000 !important;
}

.author__bio {
  color: #1a1a1a !important;
}

.author__urls-wrapper p,
.author__urls-wrapper li {
  color: #1a1a1a !important;
}

/* Make social links blue in light mode */
.author__urls.social-icons a {
  color: #0066cc !important;
}

.author__urls.social-icons a:hover {
  color: #0052a3 !important;
}

.author__urls.social-icons i,
.author__urls.social-icons svg {
  color: #0066cc !important;
}
</style>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
  🌙
</button>

<script>
// Check for saved theme preference or default to light mode
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
  document.body.classList.add('dark-mode');
  document.getElementById('theme-toggle').innerHTML = '☀️';
}

function toggleTheme() {
  const body = document.body;
  const button = document.getElementById('theme-toggle');
  
  if (body.classList.contains('dark-mode')) {
    body.classList.remove('dark-mode');
    button.innerHTML = '🌙';
    localStorage.setItem('theme', 'light');
  } else {
    body.classList.add('dark-mode');
    button.innerHTML = '☀️';
    localStorage.setItem('theme', 'dark');
  }
}
</script>
