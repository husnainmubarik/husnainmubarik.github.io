<!-- Dark mode toggle button and script -->
<style>
.theme-toggle {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 9999;
  background: #333;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.3s;
}

.theme-toggle:hover {
  background: #555;
}

body.dark-mode {
  background-color: #1a1a1a;
  color: #e0e0e0;
}

body.dark-mode .page {
  background-color: #1a1a1a;
}

body.dark-mode .masthead {
  background-color: #2a2a2a;
  border-bottom-color: #444;
}

body.dark-mode .sidebar {
  background-color: #2a2a2a;
}

body.dark-mode .author__avatar img {
  border-color: #444;
}

body.dark-mode .author__content,
body.dark-mode .author__urls-wrapper {
  color: #e0e0e0;
}

body.dark-mode .author__urls.social-icons a {
  color: #9cb5d4;
}

body.dark-mode .page__content h1,
body.dark-mode .page__content h2,
body.dark-mode .page__content h3,
body.dark-mode .page__content h4 {
  color: #e0e0e0;
}

body.dark-mode a {
  color: #6ea8fe;
}

body.dark-mode a:hover {
  color: #9ec5fe;
}

body.dark-mode .news-box {
  background-color: #2a2a2a;
  border-color: #444;
}

body.dark-mode .page__footer {
  background-color: #2a2a2a;
  border-top-color: #444;
}

body.dark-mode code {
  background-color: #2a2a2a;
  color: #e0e0e0;
}
</style>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
  🌙 Dark Mode
</button>

<script>
// Check for saved theme preference or default to light mode
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
  document.body.classList.add('dark-mode');
  document.getElementById('theme-toggle').innerHTML = '☀️ Light Mode';
}

function toggleTheme() {
  const body = document.body;
  const button = document.getElementById('theme-toggle');
  
  if (body.classList.contains('dark-mode')) {
    body.classList.remove('dark-mode');
    button.innerHTML = '🌙 Dark Mode';
    localStorage.setItem('theme', 'light');
  } else {
    body.classList.add('dark-mode');
    button.innerHTML = '☀️ Light Mode';
    localStorage.setItem('theme', 'dark');
  }
}
</script>
